<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>FocusFlow Login</title>

  <link rel="stylesheet" href="style3.css">

  <style>

    body{
      margin:0;

      font-family:Arial,sans-serif;

      background:
        linear-gradient(
          135deg,
          #a18cd1,
          #8ec5fc
        );

      display:flex;
      justify-content:center;
      align-items:center;

      height:100vh;
    }

    .container{

      width:350px;

      background:rgba(255,255,255,0.9);

      backdrop-filter:blur(10px);

      border-radius:20px;

      padding:30px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.2);

      text-align:center;
    }

    .title{

      font-size:30px;

      font-weight:bold;

      margin-bottom:20px;

      color:#333;
    }

    input{

      width:100%;

      padding:12px;

      margin:10px 0;

      border:none;

      border-radius:10px;

      outline:none;

      background:#f1f1f1;

      font-size:15px;

      box-sizing:border-box;
    }

    button{

      width:100%;

      padding:12px;

      background:#4f46e5;

      color:white;

      border:none;

      border-radius:10px;

      cursor:pointer;

      margin-top:10px;

      font-size:16px;

      transition:0.3s;
    }

    button:hover{

      background:#4338ca;

      transform:scale(1.02);
    }

    .toggle{

      margin-top:18px;

      font-size:14px;

      color:#444;
    }

    .toggle a{

      color:#4f46e5;

      text-decoration:none;

      font-weight:bold;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="title">
      Login
    </div>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Enter Password"
    >

    <button onclick="login()">
      Login
    </button>

    <p class="toggle">

      New user?

      <a href="signup.html">
        Register
      </a>

    </p>

  </div>

  <script>

    function login() {

      const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

      const pass =
        document
        .getElementById("loginPassword")
        .value
        .trim();

      // Get saved user
      const savedUser =
        JSON.parse(
          localStorage.getItem("user")
        );

      // No user found
      if (!savedUser) {

        alert(
          "No account found. Please register first."
        );

        return;
      }

      // Check credentials
      if (

        savedUser.email === email &&

        savedUser.password === pass

      ) {

        alert("Login Successful ✅");

        localStorage.setItem(
          "loggedIn",
          "true"
        );

        // Redirect
        window.location.href =
          "index.html";

      } else {

        alert(
          "Invalid Email or Password ❌"
        );
      }
    }

  </script>

</body>

</html>
